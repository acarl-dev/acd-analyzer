services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: acd_app
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - postgres

  nginx:
    image: nginx:alpine
    container_name: acd_nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  postgres:
    image: postgres:16
    container_name: acd_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: acd_analyzer
      POSTGRES_USER: acd_user
      POSTGRES_PASSWORD: acd_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    image: node:22-alpine
    container_name: acd_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"

volumes:
  postgres_data: